<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg">
<title>ReliefReady Driver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="assets/common.css">
<style>
.app{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;padding-block:16px 40px;align-items:start}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
.mapcol .mapbox{height:min(72vh,640px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.mapcol{position:static;order:-1}.mapcol .mapbox{height:52vh;min-height:300px}}
.next{border:2px solid var(--accent)}
.next .pb{display:flex;flex-direction:column;gap:12px}
.next h2.place{font-size:26px;line-height:1.1}
.items{display:flex;flex-wrap:wrap;gap:8px 22px}
.items div{display:flex;flex-direction:column}
.items b{font:600 22px/1.1 var(--f-mono)}
.items span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alts button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);cursor:pointer}
.alts button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.alts .t{font-weight:700}
.alts .m{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.hazlist{margin:0;padding-left:18px;font-size:13.5px}
.stopnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono);flex:none}
.stopnum.done{background:var(--ok)}
.picking{outline:3px dashed var(--accent);outline-offset:-3px}
.pickbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:5px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 20px)}
.pickbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 8px;cursor:pointer}
.rt-safe{stroke:var(--ok)} .rt-caution{stroke:var(--warn)} .rt-unsafe{stroke:var(--bad)} .rt-alt{stroke:var(--muted);opacity:.55}
.rt-est{stroke-dasharray:8 8}
details>summary{cursor:pointer;font-weight:700;font-family:var(--f-display);font-stretch:85%;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open]>summary::after{content:"−"}
details>summary .sub{font:400 13px var(--f-body);color:var(--muted);margin-left:auto}
.fold{padding:14px 16px}
.fold .inner{padding-top:12px;display:flex;flex-direction:column;gap:12px}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div id="root"></div>

<script src="assets/leaflet.js"></script>
<script src="assets/jsQR.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
(function(){
const root = document.getElementById('root');
let S = RR.session();
if(!S || S.role!=='driver' || (RR.CONFIG.api && !S.token)){ RR.renderSignIn(root, 'driver', s => { S = s; boot(); }); } else boot();

function boot(){
const $ = id => document.getElementById(id);
if(!S.type){ const a = RR.ACCOUNTS.find(x=>x.id===S.id); S.type = (a&&a.type)||'truck'; }
const isBoat = S.type==='boat';

root.innerHTML = `
<header class="bar"><div class="wrap">
  ${RR.backBtn()}
  <a class="logo" href="index.html">${RR.logo}<b>ReliefReady</b><span>${isBoat?'Boat crew':'Driver'}</span></a>
  <span class="net" id="net">Online</span><span class="pill warn" id="outbox" hidden></span>
  <span class="grow"></span>
  <div class="who"><span><b>${RR.esc(S.name)}</b> <span class="hint">· ${RR.esc(S.vehicle)}</span></span><button class="btn small" id="out">Sign out</button></div>
</div></header>
<main class="wrap app">
  <div class="stack">
    <section class="panel next" id="next" aria-live="polite"></section>
    <section class="panel"><div class="ph"><h2>My stops</h2><span class="sub">In delivery order</span></div><div class="pb" id="stops"></div></section>
    <section class="panel fold"><details id="addStop"><summary>Add where I serve next <span class="sub">New camp or need you found</span></summary><div class="inner">
      <div class="grid2"><div class="field"><label for="as-name">Place name</label><input type="text" id="as-name" placeholder="e.g. Sargur community hall"></div></div>
      <div class="grid2"><div class="field"><label for="as-w">Water (L)</label><input type="number" id="as-w" min="0" value="100"></div><div class="field"><label for="as-f">Food (pkts)</label><input type="number" id="as-f" min="0" value="60"></div><div class="field"><label for="as-i">Infant kits</label><input type="number" id="as-i" min="0" value="0"></div></div>
      <div class="field"><label for="as-note">Note for control room</label><input type="text" id="as-note" placeholder="e.g. 35 people, 2 bedridden"></div>
      <div class="btns"><button class="btn primary" id="as-here">Add at my position</button><button class="btn" id="as-map">Pick on map</button></div></div></details></section>
    <section class="panel fold"><details id="road" open><summary>Report road condition <span class="sub">Warns every driver and the control room</span></summary><div class="inner">
      <div class="seg" role="group" aria-label="Condition" id="rtype">${Object.entries(RR.HAZ).map(([k,v],i)=>`<button type="button" data-rt="${k}" aria-pressed="${i===0}">${v.label}</button>`).join('')}</div>
      <div class="field"><label for="r-note">Details</label><input type="text" id="r-note" placeholder="e.g. water knee-deep near the temple, tractors only"></div>
      <div class="btns"><button class="btn primary" id="r-here">Report at my position</button><button class="btn" id="r-map">Pick on map</button></div></div></details></section>
    <section class="panel fold"><details id="relay"><summary>Carry SOS from a no-signal area <span class="sub">Scan or paste from a trapped person's phone</span></summary><div class="inner">
      <p class="hint">People without signal show you a QR code or share a text by Bluetooth. Add it here. It uploads the moment your phone gets signal.</p>
      <div class="btns"><label class="btn primary" for="qrfile">Scan QR (camera)</label><input type="file" id="qrfile" accept="image/*" capture="environment" hidden></div>
      <div class="field"><label for="relayTxt">Or paste SOS text</label><textarea id="relayTxt" placeholder="RR1 12.03500,76.30500 P64 I4 …"></textarea></div>
      <div class="btns"><button class="btn" id="relayAdd">Add SOS</button></div><div id="relayed" class="hint"></div></div></details></section>
    <section class="panel fold"><details id="help"><summary>Request help from authorities <span class="sub">Boat, airlift, medical, rescue team</span></summary><div class="inner" id="helpBody"></div></details></section>
  </div>
  <div class="mapcol"><div class="mapbox" id="map"></div><div class="vlegend" style="margin-top:8px"><span>${RR.vehSvg('truck')}Truck</span><span>${RR.vehSvg('jeep')}4x4 jeep</span><span class="b">${RR.vehSvg('boat')}Rescue boat</span><span>Filled marker = you</span></div><div class="vlegend" style="margin-top:4px">${RR.zoneLegend()}</div><p class="hint" style="margin-top:6px">Route options come from OpenStreetMap road data and are checked against road reports within ${RR.CONFIG.hazardRadiusM} m and against impact zones. Use the layers button (top right of the map) for satellite, terrain and government layers. Tap a marker for details.</p></div>
</main>`;
$('out').onclick = RR.signOut;
RR.netBadge($('net'));

const me = () => RR.store.get('drivers', S.id) || {id:S.id, name:S.name, vehicle:S.vehicle, type:S.type, lat:RR.DEPOT.lat, lon:RR.DEPOT.lon, status:'at depot', lastSeen:Date.now()};
const myStops = () => RR.store.all('stops').filter(s => s.driverId===S.id).sort((a,b)=>(a.status==='delivered')-(b.status==='delivered') || a.order-b.order);
const nextStop = () => myStops().find(s => s.status!=='delivered' && s.status!=='unreachable') || null;
const hazards = () => RR.store.all('reports');
function put(col, doc){ if(RR.online()) RR.store.put(col, doc); else { RR.outbox.add({col, doc}); RR.store.data[col][doc.id||'tmp'] = doc; render(); } updOutbox(); }
function updOutbox(){ const n = RR.outbox.all().length; $('outbox').hidden = !n; $('outbox').textContent = n+' waiting for signal'; }

/* map */
const map = RR.makeMap($('map'), {fitDistrict:true});
const layers = {base:L.layerGroup().addTo(map), route:L.layerGroup().addTo(map)};
let pick = null, pickBar = null;
function startPick(kind){
  pick = kind; $('map').classList.add('picking');
  pickBar = document.createElement('div'); pickBar.className='pickbar'; pickBar.innerHTML = `Tap the map to place the ${kind==='stop'?'stop':'road report'} <button type="button">Cancel</button>`;
  pickBar.querySelector('button').onclick = endPick; $('map').appendChild(pickBar);
  $('map').scrollIntoView({behavior:'smooth', block:'center'});
}
function endPick(){ pick=null; $('map').classList.remove('picking'); pickBar && pickBar.remove(); }
map.on('click', e => { if(!pick) return; const p = {lat:e.latlng.lat, lon:e.latlng.lng}; if(pick==='stop') addStop(p); else addReport(p); endPick(); });

function drawBase(){
  RR.drawZones(map);
  layers.base.clearLayers();
  L.marker([RR.DEPOT.lat,RR.DEPOT.lon],{icon:RR.icon('pin depot')}).bindPopup(`<b>${RR.DEPOT.name}</b><br>Depot`).addTo(layers.base);
  hazards().forEach(h => L.marker([h.lat,h.lon],{icon:RR.hzIcon(h)}).bindPopup(`<b>${RR.HAZ[h.type]?.label||h.type}</b><br>${RR.esc(h.note||'')}<br><span class="hint">${RR.esc(h.by||'')} · ${RR.ago(h.createdAt)}</span>`).addTo(layers.base));
  myStops().forEach((s,i) => L.marker([s.lat,s.lon],{icon:RR.icon('stopnum'+(s.status==='delivered'?' done':''), String(i+1))}).bindPopup(`<b>${RR.esc(s.name)}</b><br>${s.items.water||0} L water · ${s.items.food||0} food · ${s.items.infant||0} infant kits<br>${RR.esc(s.note||'')}`).addTo(layers.base));
  RR.store.all('sos').filter(s => s.lat && s.status!=='served').forEach(s => L.marker([s.lat,s.lon],{icon:RR.icon('pin sos pulse')}).bindPopup(`<b>SOS · ${RR.esc(s.place||'')}</b><br>${s.people} people · ${(s.needs||[]).join(', ')}<br>${RR.esc(s.note||'')}<br><span class="hint">${RR.ago(s.createdAt)}</span>`).addTo(layers.base));
  RR.store.all('drivers').filter(d => d.id!==S.id && d.lastSeen).forEach(d => L.marker([d.lat,d.lon],{icon:RR.vehIcon(d.type, d.name.split(' ')[0])}).bindPopup(`<b>${RR.esc(d.name)}</b><br>${RR.esc(d.vehicle)}<br>${RR.esc(d.status||'')} · ${RR.ago(d.lastSeen)}`).addTo(layers.base));
  const m = me(); L.marker([m.lat,m.lon],{icon:RR.vehIcon(S.type, 'You', true), zIndexOffset:1000}).bindPopup(`<b>You</b> · ${RR.esc(S.vehicle)}`).addTo(layers.base);
}

/* routing for next stop */
let alts = [], altIdx = 0, routedFor = '';
async function routeNext(force){
  const n = nextStop(); const m = me();
  const key = n ? [n.id,n.lat,n.lon,m.lat.toFixed(4),m.lon.toFixed(4),hazards().length,RR.store.all('zones').map(z=>z.id+z.type+z.coords.length).join()].join('|') : '';
  if(!force && key===routedFor) return; routedFor = key;
  alts = []; altIdx = 0; drawRoute(); renderNext();
  if(!n) return;
  alts = isBoat ? [(c => ({coords:c, distance:RR.dist(m,n), duration:RR.dist(m,n)/3.5, estimate:true, boat:true, ...RR.assessRoute(c, hazards(), {boat:true})}))([[m.lat,m.lon],[n.lat,n.lon]])] : await RR.route(m, n, hazards()); altIdx = 0; drawRoute(); renderNext();
}
function drawRoute(){
  layers.route.clearLayers();
  alts.forEach((a,i) => { if(i!==altIdx) L.polyline(a.coords,{weight:4, className:'rt-alt'+(a.estimate?' rt-est':'')}).addTo(layers.route); });
  const a = alts[altIdx]; if(a){ const pl = L.polyline(a.coords,{weight:6, className:'rt-'+a.verdict+(a.estimate?' rt-est':'')}).addTo(layers.route); map.fitBounds(pl.getBounds(),{padding:[40,40], maxZoom:14}); }
}

function renderNext(){
  const n = nextStop(), el = $('next');
  if(!n){ el.innerHTML = `<div class="ph"><h2>No stops left</h2></div><div class="pb"><p class="hint">All assigned deliveries are done. Return to ${RR.DEPOT.name} to reload, or add a stop you found on the way.</p></div>`; return; }
  const a = alts[altIdx];
  const verdict = a ? RR.verdictPill(a.verdict) : '<span class="pill">Checking routes…</span>';
  const hz = a ? a.hits : [];
  el.innerHTML = `<div class="ph"><h2>Next stop</h2><span class="sub">${n.status==='enroute'?'<span class="pill info">On the way</span>':'Not started'}</span></div>
  <div class="pb">
    <h2 class="place">${RR.esc(n.name)}</h2>
    ${n.note?`<p class="hint" style="margin:0">${RR.esc(n.note)}</p>`:''}
    <div class="items"><div><b>${n.items.water||0}</b><span>Water L</span></div><div><b>${n.items.food||0}</b><span>Food pkts</span></div><div><b>${n.items.infant||0}</b><span>Infant kits</span></div>${n.items.meds?`<div><b>${n.items.meds}</b><span>Med kits</span></div>`:''}
      ${a?`<div><b>${RR.km(a.distance)}</b><span>Distance</span></div><div><b>${Math.round(a.duration/60)} min</b><span>${a.estimate?'Rough estimate':'Drive time'}</span></div>`:''}</div>
    <div class="rowhead">${verdict}${RR.zonePill(n)}${isBoat?'':(RR.zonesAt(n).some(z=>z.type==='flooded')?'<span class="pill info">Boat recommended</span>':'')}${a&&a.confirmed?`<span class="pill ok">${a.confirmed} stretch${a.confirmed>1?'es':''} confirmed safe</span>`:''}${a&&a.boat?'<span class="pill info">Boat: direct water route. Check depth, current and power lines.</span>':a&&a.estimate?'<span class="pill">Offline: straight-line estimate</span>':''}</div>
    ${hz.length?`<ul class="hazlist">${hz.map(h=>`<li><b>${RR.hitLabel(h)}</b>: ${RR.esc(h.note||'')} <span class="hint">(${RR.ago(h.createdAt)})</span></li>`).join('')}</ul>`:''}
    ${alts.length>1?`<div><div class="lbl" style="margin-bottom:6px">Route options</div><ul class="alts">${alts.map((x,i)=>`<li><button type="button" data-alt="${i}" aria-pressed="${i===altIdx}"><span class="t">Option ${i+1} · ${Math.round(x.duration/60)} min · ${RR.km(x.distance)}</span>${RR.verdictPill(x.verdict)}<span class="m">${x.hits.length?x.hits.map(RR.hitLabel).join(', '):'No reported hazards on this road'}</span></button></li>`).join('')}</ul></div>`:''}
    ${a&&a.verdict==='unsafe'&&alts.every(x=>x.verdict==='unsafe')?`<div class="pill bad" style="white-space:normal;padding:8px 10px;border-radius:5px">No safe road route. Request a boat, airlift or bridge team below.</div>`:''}
    <div class="btns">
      ${n.status!=='enroute'?'<button class="btn primary" id="go">Start trip</button>':''}
      <button class="btn primary" id="done">Mark delivered</button>
      <button class="btn" id="cant">Can't reach</button>
      <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lon}">Open in Maps</a>
    </div>
    <div id="doneForm" hidden class="stack"></div>
  </div>`;
  el.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => { altIdx = +b.dataset.alt; drawRoute(); renderNext(); });
  const go = $('go'); if(go) go.onclick = () => { put('stops', {...n, status:'enroute', startedAt:Date.now()}); setStatus('on the road to '+n.name); };
  $('done').onclick = () => {
    const f = $('doneForm'); f.hidden = false;
    f.innerHTML = `<div class="grid2"><div class="field"><label for="d-w">Water given (L)</label><input type="number" id="d-w" min="0" value="${n.items.water||0}"></div><div class="field"><label for="d-f">Food given</label><input type="number" id="d-f" min="0" value="${n.items.food||0}"></div><div class="field"><label for="d-i">Infant kits given</label><input type="number" id="d-i" min="0" value="${n.items.infant||0}"></div></div>
      <div class="field"><label for="d-n">People served / remarks</label><input type="text" id="d-n" placeholder="e.g. 140 people, more water needed tomorrow"></div><div class="btns"><button class="btn primary" id="d-ok">Confirm delivery</button></div>`;
    $('d-ok').onclick = () => {
      put('stops', {...n, status:'delivered', deliveredAt:Date.now(), given:{water:+$('d-w').value||0, food:+$('d-f').value||0, infant:+$('d-i').value||0}, remark:$('d-n').value});
      if(n.sosId && RR.store.get('sos', n.sosId)) put('sos', {...RR.store.get('sos', n.sosId), status:'served'});
      setStatus('delivered at '+n.name); RR.toast('Delivery recorded'); routeNext(true);
    };
  };
  $('cant').onclick = () => {
    const f = $('doneForm'); f.hidden = false;
    f.innerHTML = `<div class="field"><label for="c-r">What is blocking you?</label><select id="c-r">${Object.entries(RR.HAZ).filter(([k])=>k!=='safe').map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div>
      <div class="field"><label for="c-n">Details</label><input type="text" id="c-n" placeholder="Where exactly, how bad"></div>
      <div class="btns"><button class="btn danger" id="c-ok">Report and mark unreachable</button></div>`;
    $('c-ok').onclick = () => {
      const m = me(); put('reports', {id:'hz-'+Date.now().toString(36), lat:m.lat, lon:m.lon, type:$('c-r').value, note:$('c-n').value||('Cannot reach '+n.name), by:S.id, createdAt:Date.now()});
      put('stops', {...n, status:'unreachable', remark:$('c-n').value});
      RR.toast('Reported. Control room notified.');
      $('help').open = true; prefillHelp(n); $('help').scrollIntoView({behavior:'smooth'});
    };
  };
}
function setStatus(st){ const m = me(); put('drivers', {...m, status:st, lastSeen:Date.now()}); }

/* stops list */
function renderStops(){
  const list = myStops();
  if(!list.length){ $('stops').innerHTML = '<p class="hint">No stops assigned yet. The control room will add them, or add one yourself below.</p>'; return; }
  const ST = {pending:['Pending',''], enroute:['On the way','info'], delivered:['Delivered','ok'], unreachable:['Unreachable','bad']};
  $('stops').innerHTML = '<ul class="rows">'+list.map((s,i)=>`<li><div class="rowhead"><span class="stopnum ${s.status==='delivered'?'done':''}">${i+1}</span><b>${RR.esc(s.name)}</b><span class="pill ${ST[s.status][1]}">${ST[s.status][0]}</span>${s.source==='driver'?'<span class="pill">Added by you</span>':''}
    <span style="margin-left:auto" class="btns">${s.status!=='delivered'?`<button class="btn small" data-up="${s.id}" aria-label="Move up">↑</button><button class="btn small" data-down="${s.id}" aria-label="Move down">↓</button>`:''}${s.status==='unreachable'?`<button class="btn small" data-retry="${s.id}">Retry</button>`:''}</span></div>
    <span class="meta">${s.items.water||0} L water · ${s.items.food||0} food · ${s.items.infant||0} infant kits${s.items.meds?' · '+s.items.meds+' med kits':''}${s.note?' · '+RR.esc(s.note):''}</span></li>`).join('')+'</ul>';
}
function move(id, d){
  const open = myStops().filter(s=>s.status!=='delivered'); const i = open.findIndex(s=>s.id===id), j = i+d;
  if(j<0||j>=open.length) return; [open[i],open[j]] = [open[j],open[i]];
  open.forEach((s,k) => { if(s.order!==k+1) put('stops', {...s, order:k+1}); });
  routeNext(true);
}

/* add stop / report */
function addStop(p){
  const name = $('as-name').value.trim(); if(!name){ RR.toast('Give the place a name first.'); $('as-name').focus(); return; }
  const max = Math.max(0, ...myStops().map(s=>s.order));
  put('stops', {id:'st-'+Date.now().toString(36), driverId:S.id, name, lat:p.lat, lon:p.lon, items:{water:+$('as-w').value||0, food:+$('as-f').value||0, infant:+$('as-i').value||0}, order:max+1, status:'pending', note:$('as-note').value.trim(), source:'driver', createdAt:Date.now()});
  $('as-name').value=''; $('as-note').value=''; RR.toast('Stop added and shared with the control room');
}
let rtype = 'bridge';
$('rtype').onclick = e => { const b = e.target.closest('[data-rt]'); if(!b) return; rtype = b.dataset.rt; $('rtype').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); };
function addReport(p){ put('reports', {id:'hz-'+Date.now().toString(36), lat:p.lat, lon:p.lon, type:rtype, note:$('r-note').value.trim(), by:S.id, createdAt:Date.now()}); $('r-note').value=''; RR.toast('Road report shared with all drivers'); routeNext(true); }
$('as-here').onclick = () => addStop(me()); $('as-map').onclick = () => startPick('stop');
$('r-here').onclick = () => addReport(me()); $('r-map').onclick = () => startPick('report');

/* relay */
function relay(text){
  const found = String(text).split(/(?=RR1\s)/).map(RR.decodeSOS).filter(Boolean);
  if(!found.length){ RR.toast('No ReliefReady SOS code found in that text.'); return; }
  found.forEach(s => put('sos', {...s, id:'sos-'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), channel:'relay', relayedBy:S.id, status:'new'}));
  $('relayed').textContent = `${found.length} SOS added${RR.online()?' and uploaded':', will upload when you get signal'}.`; $('relayTxt').value='';
}
$('relayAdd').onclick = () => relay($('relayTxt').value);
$('qrfile').onchange = e => {
  const f = e.target.files[0]; if(!f) return; const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); const k = Math.min(1, 1400/Math.max(img.width,img.height)); c.width=img.width*k; c.height=img.height*k; const x = c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
    const r = jsQR(x.getImageData(0,0,c.width,c.height).data, c.width, c.height); URL.revokeObjectURL(img.src);
    if(r && r.data) relay(r.data); else RR.toast('No QR code found. Hold the phone steady and fill the frame with the code.'); };
  img.src = URL.createObjectURL(f); e.target.value='';
};

/* escalation */
const TARGETS = ['District control room','State EOC (KSDMA)','NDRF','Fire & Rescue','Health / 108 ambulance','Air support (IAF)','Army engineers (bridge)'];
const TYPES = ['Boat evacuation','Airlift / air drop','Medical evacuation','Rescue team','Bridge / road clearing','More supplies','Fuel / vehicle breakdown'];
function renderHelp(){
  const mine = RR.store.all('escalations').filter(e=>e.by===S.id).sort((a,b)=>b.createdAt-a.createdAt);
  const n = nextStop();
  $('helpBody').innerHTML = `<div class="grid2"><div class="field"><label for="h-to">Send to</label><select id="h-to">${TARGETS.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label for="h-type">Help needed</label><select id="h-type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label for="h-urg">Urgency</label><select id="h-urg"><option>Critical</option><option selected>High</option><option>Medium</option></select></div></div>
    <div class="grid2"><div class="field"><label for="h-place">Place</label><input type="text" id="h-place" value="${RR.esc(n?n.name:'')}"></div><div class="field"><label for="h-people">People affected</label><input type="number" id="h-people" min="0" value="0"></div></div>
    <div class="field"><label for="h-note">Situation</label><textarea id="h-note" placeholder="What you see, what is needed, access conditions"></textarea></div>
    <div class="btns"><button class="btn danger" id="h-send">Send request</button></div>
    ${mine.length?`<div class="lbl">My requests</div><ul class="rows">${mine.map(e=>`<li><div class="rowhead"><b>${RR.esc(e.type)}</b> → ${RR.esc(e.to)} ${escPill(e.status)}</div><span class="meta">${RR.esc(e.place)} · ${RR.ago(e.createdAt)}</span></li>`).join('')}</ul>`:''}`;
  $('h-send').onclick = () => {
    const n = nextStop(), m = me(), at = n && $('h-place').value===n.name ? n : m;
    put('escalations', {id:'esc-'+Date.now().toString(36), from:'driver', by:S.id, to:$('h-to').value, type:$('h-type').value, place:$('h-place').value||'Driver position', lat:at.lat, lon:at.lon, people:+$('h-people').value||0, urgency:$('h-urg').value, note:$('h-note').value, status:'sent', createdAt:Date.now(), timeline:[{t:Date.now(), s:'sent', n:'Raised by '+S.name+' ('+S.vehicle+')'}]});
    RR.toast('Request sent. You will see the status here.'); $('h-note').value='';
  };
}
function prefillHelp(n){ renderHelp(); $('h-place').value = n.name; $('h-type').value = 'Boat evacuation'; $('h-to').value = 'District control room'; }
window.escPill = s => ({sent:'<span class="pill warn">Sent</span>',acknowledged:'<span class="pill info">Acknowledged</span>',dispatched:'<span class="pill info">Help dispatched</span>',resolved:'<span class="pill ok">Resolved</span>'}[s]||'');

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.up) move(b.dataset.up,-1); else if(b.dataset.down) move(b.dataset.down,1);
  else if(b.dataset.retry){ put('stops', {...RR.store.get('stops', b.dataset.retry), status:'pending'}); routeNext(true); }
});

/* GPS tracking */
let lastSent = 0;
if(navigator.geolocation) navigator.geolocation.watchPosition(p => {
  const m = me(), np = {lat:p.coords.latitude, lon:p.coords.longitude};
  if(Date.now()-lastSent > 60e3 || RR.dist(m,np) > 150){ lastSent = Date.now(); put('drivers', {...m, ...np, lastSeen:Date.now()}); }
}, ()=>{}, {enableHighAccuracy:true, maximumAge:30000});

function render(){ drawBase(); renderStops(); renderNext(); if(!$('helpBody').contains(document.activeElement)) renderHelp(); routeNext(false); updOutbox(); }
RR.store.on(render);
render();
RR.outbox.flush();
}
})();
</script>
