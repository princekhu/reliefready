<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg">
<title>ReliefReady Control Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="assets/common.css">
<style>
/* Control room: fixed sidebar navigation, one working area per section. */
body{min-height:100%}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.side .logo{padding:2px 6px 14px}
.side .logo b{font-size:20px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav .grp{font:600 10.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav button,.nav a{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:5px;background:none;color:var(--ink);font:500 14px var(--f-body);cursor:pointer;text-align:left;text-decoration:none}
.nav button:hover,.nav a:hover{background:var(--sunk)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto}
.side .foot2{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.warn::before{background:var(--warn)} .conn.bad::before{background:var(--bad)}
.main{min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:16px}
.mh{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.mh h1{font-size:28px;font-weight:700}
.mh p{margin:4px 0 0;color:var(--muted);font-size:14px}
.mh .when{font:500 13px var(--f-mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .kpi.alert b{color:var(--bad)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.top.solo{grid-template-columns:minmax(0,1fr)}
.top .mapbox{height:min(62vh,600px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.feed{max-height:calc(min(62vh,600px) - 52px);overflow:auto}
.prio{font:700 17px/1 var(--f-mono);min-width:36px;text-align:center;padding:6px 0;border-radius:4px;background:var(--sunk)}
.prio.hi{background:var(--bad-bg);color:var(--bad)} .prio.mid{background:var(--warn-bg);color:var(--warn)}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.tabpanel{padding:18px}
.drv{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.drvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline .field{min-width:120px;flex:1}
.esc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.esc.crit{border-left:4px solid var(--bad)}
.sitrep{white-space:pre-wrap;font:12.5px/1.55 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0;max-height:260px;overflow:auto}
.rt-line{stroke:var(--accent)}
@media (max-width:1100px){.top{grid-template-columns:minmax(0,1fr)}.feed{max-height:420px}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:900;flex-direction:row;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .side .logo{padding:0;flex:none}.side .logo b{display:none}
  .nav{flex:none}
  .nav{flex-direction:row;margin:0}.nav .grp{display:none}.nav button,.nav a{white-space:nowrap;padding:7px 9px}
  .side .foot2{margin:0;border:0;padding:0;flex-direction:row;align-items:center;white-space:nowrap}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .top .mapbox{height:360px}
}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div id="root"></div>
<script src="assets/leaflet.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
(function(){
const root = document.getElementById('root');
let S = RR.session();
if(!S || S.role!=='admin' || (RR.CONFIG.api && !S.token)){ RR.renderSignIn(root, 'admin', s => { S = s; boot(); }); } else boot();

function boot(){
const $ = id => document.getElementById(id);
root.innerHTML = `
<div class="shell">
<aside class="side" aria-label="Control room navigation">
  <a class="logo" href="index.html">${RR.logo}<b>ReliefReady</b></a>
  <nav class="nav" id="tabs">
    <span class="grp">Operations</span>
    <button type="button" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Overview</button>
    <button type="button" data-tab="sos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>SOS requests<span class="count" id="c-sos"></span></button>
    <button type="button" data-tab="fleet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Fleet and stops</button>
    <button type="button" data-tab="zones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/></svg>Impact zones</button>
    <button type="button" data-tab="roads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L4 21M16 3l4 18M12 5v2M12 11v2M12 17v2"/></svg>Road conditions<span class="count" id="c-roads"></span></button>
    <button type="button" data-tab="esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Agency requests<span class="count" id="c-esc"></span></button>
    <span class="grp">Tools</span>
    <a href="planner.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Allocation planner</a>
    <button type="button" data-tab="sms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>SMS inbox</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
  <div class="foot2"><span class="conn" id="mode">Connecting…</span><span><b>${RR.esc(S.name)}</b></span><button class="btn small" id="out">Sign out</button></div>
</aside>
<main class="main">
  <header class="mh"><div><h1 id="pt">Overview</h1><p id="ps"></p></div><span class="when" id="when"></span></header>
  <div class="kpis" id="kpis"></div>
  <div class="top" id="mapRow">
    <div><div class="mapbox" id="map"></div><div class="vlegend" style="margin-top:8px"><span>${RR.vehSvg('truck')}Truck</span><span>${RR.vehSvg('jeep')}4x4 jeep</span><span class="b">${RR.vehSvg('boat')}Rescue boat</span><span><span class="pin sos" style="display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px"></span>SOS</span><span><span class="pin stop" style="display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px"></span>Planned stop</span></div><div class="vlegend" style="margin-top:4px">${RR.zoneLegend()}</div></div>
    <section class="panel" id="feedPanel"><div class="ph"><h2>Incoming SOS</h2><span class="sub">Highest priority first</span></div><div class="pb feed" id="feed"></div></section>
  </div>
  <section class="panel" id="panelWrap"><div class="tabpanel" id="panel"></div></section>
</main>
</div>`;
$('out').onclick = RR.signOut;
const tick = () => { $('when').textContent = RR.CONFIG.district + ' · ' + new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
tick(); setInterval(tick, 30000);
const SECTIONS = {
  overview:['Overview','Live picture of requests, vehicles, zones and road conditions.', true, true, true],
  sos:['SOS requests','Every request from the SOS app, SMS line and driver relays, ranked by priority.', false, false, false],
  fleet:['Fleet and stops','Vehicles, their delivery stops and progress. Click the map to place a new stop.', true, false, false],
  zones:['Impact zones','Areas that block routes, raise SOS priority and decide boat or road delivery.', true, false, false],
  roads:['Road conditions','Hazards reported by drivers. Every route option is checked against these.', true, false, false],
  esc:['Agency requests','Requests for help to the State EOC, NDRF, health services and air support.', false, false, false],
  sms:['SMS inbox','SOS messages received by SMS from areas without internet.', false, false, false],
  settings:['Settings','Server connection, SMS number and government map layers.', false, false, false],
};
let tab = 'overview'; try{ tab = sessionStorage.getItem('rr.tab') || 'overview'; }catch(e){}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if(!b) return; tab = b.dataset.tab; try{ sessionStorage.setItem('rr.tab', tab); }catch(e){} renderTab(); };

const drivers = () => { const d = RR.store.all('drivers'); RR.ACCOUNTS.filter(a=>a.role==='driver').forEach(a => { if(!d.find(x=>x.id===a.id)) d.push({id:a.id,name:a.name,vehicle:a.vehicle,type:a.type,lat:RR.DEPOT.lat,lon:RR.DEPOT.lon,status:'not signed in',lastSeen:0}); }); return d; };
const openSOS = () => RR.store.all('sos').filter(s=>s.status!=='served').sort((a,b)=>RR.sosPriority(b)-RR.sosPriority(a));
const needTxt = s => (s.needs||[]).map(k=>RR.NEEDS.find(n=>n.k===k)?.en||k).join(', ');
const chan = {app:'App',sms:'SMS',relay:'Relayed by driver'};
const pcls = p => p>=70?'hi':p>=45?'mid':'';
const ST = {new:['New','warn'],verified:['Verified','info'],assigned:['Assigned','info'],served:['Served','ok'],escalated:['Escalated','bad']};

/* map */
const map = RR.makeMap($('map'), {center:[11.62,76.09], zoom:11});
const lay = L.layerGroup().addTo(map);
function drawMap(){
  RR.drawZones(map);
  lay.clearLayers();
  L.marker([RR.DEPOT.lat,RR.DEPOT.lon],{icon:RR.icon('pin depot')}).bindPopup(`<b>${RR.DEPOT.name}</b>`).addTo(lay);
  RR.store.all('reports').forEach(h => L.marker([h.lat,h.lon],{icon:RR.hzIcon(h)}).bindPopup(`<b>${RR.HAZ[h.type]?.label}</b><br>${RR.esc(h.note)}<br><span class="hint">${RR.esc(h.by)} · ${RR.ago(h.createdAt)}</span>`).addTo(lay));
  RR.store.all('stops').filter(s=>s.status!=='delivered').forEach(s => L.marker([s.lat,s.lon],{icon:RR.icon('pin stop')}).bindPopup(`<b>${RR.esc(s.name)}</b><br>Driver ${RR.esc(s.driverId)} · ${s.status}`).addTo(lay));
  openSOS().filter(s=>s.lat).forEach(s => L.marker([s.lat,s.lon],{icon:RR.icon('pin sos'+(RR.sosPriority(s)>=70?' pulse':''))}).bindPopup(`<b>SOS · ${RR.esc(s.place||'')}</b><br>Priority ${RR.sosPriority(s)} · ${s.people} people<br>${needTxt(s)}<br>${RR.esc(s.note||'')}`).addTo(lay));
  drivers().forEach(d => { if(!d.lastSeen) return; L.marker([d.lat,d.lon],{icon:RR.vehIcon(d.type, d.name.split(' ')[0]), zIndexOffset:500}).bindPopup(`<b>${RR.esc(d.name)}</b><br>${RR.esc(d.vehicle)}<br>${RR.esc(d.status)} · ${RR.ago(d.lastSeen)}`).addTo(lay);
    const next = RR.store.all('stops').filter(s=>s.driverId===d.id && (s.status==='pending'||s.status==='enroute')).sort((a,b)=>a.order-b.order)[0];
    if(next) L.polyline([[d.lat,d.lon],[next.lat,next.lon]],{weight:2, dashArray:'4 6', className:'rt-line'}).addTo(lay); });
}

function renderKpis(){
  const o = openSOS(), crit = o.filter(s=>RR.sosPriority(s)>=70).length, ppl = o.reduce((t,s)=>t+(+s.people||0),0);
  const active = drivers().filter(d=>d.lastSeen && Date.now()-d.lastSeen<3600e3).length;
  const escOpen = RR.store.all('escalations').filter(e=>e.status!=='resolved').length;
  const unsafe = RR.store.all('reports').filter(r=>r.type!=='safe').length;
  const inZone = o.filter(s=>RR.impactZoneAt(s)).reduce((t,s)=>t+(+s.people||0),0);
  $('kpis').innerHTML = [[o.length,'Open SOS'],[crit,'Critical',crit>0],[ppl,'People waiting'],[inZone,'People in impact zones',inZone>0],[active+' / '+drivers().length,'Drivers active'],[escOpen,'Open agency requests'],[unsafe,'Road hazards']]
    .map(([b,s,a])=>`<div class="kpi ${a?'alert':''}"><b>${b}</b><span>${s}</span></div>`).join('');
  $('c-sos').textContent = o.filter(s=>s.status==='new').length || ''; $('c-roads').textContent = unsafe||''; $('c-esc').textContent = RR.store.all('escalations').filter(e=>e.status==='sent').length || '';
  const m = $('mode');
  if(RR.CONFIG.api){ const ok = RR.store.apiOk; m.textContent = ok===false ? 'Server unreachable, showing last data' : 'Connected to server'; m.className = 'conn'+(ok===false?' bad':''); }
  else { m.textContent = RR.store.mode==='shared' ? 'Shared demo data' : 'Demo mode, this browser'; m.className = 'conn warn'; }
}
function renderFeed(){
  const o = openSOS();
  $('feed').innerHTML = o.length ? '<ul class="rows">'+o.slice(0,12).map(s=>{ const p = RR.sosPriority(s); return `<li><span class="prio ${pcls(p)}">${p}</span><div><div class="rowhead"><b>${RR.esc(s.place||'GPS location')}</b><span class="pill ${ST[s.status]?.[1]}">${ST[s.status]?.[0]}</span>${RR.zonePill(s)}</div><span class="meta">${s.people} people${s.infants?' · '+s.infants+' infants':''}${s.injured?' · '+s.injured+' injured':''} · ${needTxt(s)} · ${chan[s.channel]||s.channel} · ${RR.ago(s.createdAt)}</span></div></li>`; }).join('')+'</ul>' : '<p class="hint">No open requests.</p>';
}

/* tabs */
function renderTab(){
  if(!SECTIONS[tab]) tab = 'overview';
  const [t, sub, showMap, showFeed, showKpi] = SECTIONS[tab];
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.dataset.tab===tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  $('pt').textContent = t; $('ps').textContent = sub;
  const wasHidden = $('mapRow').hidden;
  $('mapRow').hidden = !showMap; $('feedPanel').hidden = !showFeed; $('mapRow').classList.toggle('solo', !showFeed); $('kpis').hidden = !showKpi; $('panelWrap').hidden = tab==='overview';
  if(showMap) setTimeout(() => map.invalidateSize(), 30);
  if(tab==='overview') return;
  if(document.activeElement && $('panel').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  ({sos:tabSOS, fleet:tabFleet, roads:tabRoads, zones:tabZones, esc:tabEsc, sms:tabSMS, settings:tabSettings})[tab]();
}
const drvOpts = sel => drivers().map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${RR.esc(d.name)} · ${RR.esc(d.vehicle)}</option>`).join('');

function tabSOS(){
  const all = RR.store.all('sos').sort((a,b)=>(a.status==='served')-(b.status==='served') || RR.sosPriority(b)-RR.sosPriority(a));
  $('panel').innerHTML = `<p class="hint" style="margin-bottom:10px">Priority (0–100) weighs need type (rescue and medical first), people, share of infants, elderly and injured, and waiting time. Assigning creates a stop in that driver's app with suggested quantities (3 L water and 1 food packet per person, 1 kit per infant).</p>
  <div class="tw"><table><thead><tr><th>Priority</th><th>Location</th><th>Need</th><th>Source</th><th>Status</th><th>Action</th></tr></thead><tbody>${all.map(s=>{const p=RR.sosPriority(s); return `<tr>
    <td><span class="prio ${pcls(p)}">${p}</span></td>
    <td><b>${RR.esc(s.place||'GPS location')}</b><div class="meta mono">${s.lat?(+s.lat).toFixed(4)+', '+(+s.lon).toFixed(4):'no GPS'}</div>${s.note?`<div class="meta">${RR.esc(s.note)}</div>`:''}</td>
    <td>${s.people} people · ${s.infants||0} inf · ${s.elderly||0} eld · ${s.injured||0} inj<div class="meta">${needTxt(s)}</div></td>
    <td>${chan[s.channel]||s.channel}<div class="meta">${RR.ago(s.createdAt)}${s.relayedBy?' · via '+RR.esc(s.relayedBy):''}</div></td>
    <td><span class="pill ${ST[s.status]?.[1]}">${ST[s.status]?.[0]}</span>${RR.zonePill(s)}${s.assignedTo?`<div class="meta">${RR.esc(s.assignedTo)}</div>`:''}</td>
    <td>${s.status==='served'?'':`<div class="inline">${s.status==='new'?`<button class="btn small" data-verify="${s.id}">Verify</button>`:''}
      <select aria-label="Driver" id="as-${s.id}" style="width:auto">${drvOpts(s.assignedTo)}</select><button class="btn small primary" data-assign="${s.id}">Assign</button>
      <button class="btn small" data-escsos="${s.id}">Escalate</button><button class="btn small" data-served="${s.id}">Served</button></div>`}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function tabFleet(){
  $('panel').innerHTML = `<div class="drvgrid">${drivers().map(d=>{ const st = RR.store.all('stops').filter(s=>s.driverId===d.id).sort((a,b)=>(a.status==='delivered')-(b.status==='delivered')||a.order-b.order);
    return `<div class="drv"><div class="rowhead"><span class="veh ${d.type||'truck'}" style="width:28px;height:28px;box-shadow:none">${RR.vehSvg(d.type)}</span><b>${RR.esc(d.name)}</b><span class="hint">${RR.esc(d.vehicle)}</span><span class="pill ${d.lastSeen&&Date.now()-d.lastSeen<3600e3?'ok':''}" style="margin-left:auto">${RR.esc(d.status)}</span></div>
    <span class="meta">${d.lastSeen?'Last update '+RR.ago(d.lastSeen):'Has not signed in'}</span>
    <ul class="rows">${st.map((s,i)=>`<li><div class="rowhead"><span class="mono">${i+1}.</span><b>${RR.esc(s.name)}</b><span class="pill ${s.status==='delivered'?'ok':s.status==='unreachable'?'bad':s.status==='enroute'?'info':''}">${s.status}</span>${s.source==='driver'?'<span class="pill">Added by driver</span>':''}<button class="btn small" style="margin-left:auto" data-delstop="${s.id}">Remove</button></div>
      <span class="meta">${s.items.water||0} L · ${s.items.food||0} food · ${s.items.infant||0} kits${s.given?` · given ${s.given.water}/${s.given.food}/${s.given.infant}`:''}${s.remark?' · '+RR.esc(s.remark):''}${s.note?' · '+RR.esc(s.note):''}</span></li>`).join('')||'<li class="hint">No stops.</li>'}</ul></div>`; }).join('')}</div>
  <div class="section"><div class="lbl" style="margin-bottom:8px">Add a stop</div><div class="inline">
    <div class="field"><label for="ns-d">Driver</label><select id="ns-d">${drvOpts()}</select></div>
    <div class="field"><label for="ns-n">Place</label><input type="text" id="ns-n" placeholder="Muttil relief camp"></div>
    <div class="field"><label for="ns-lat">Latitude</label><input type="number" step="0.0001" id="ns-lat" value="11.6745"></div>
    <div class="field"><label for="ns-lon">Longitude</label><input type="number" step="0.0001" id="ns-lon" value="76.1310"></div>
    <div class="field"><label for="ns-w">Water L</label><input type="number" id="ns-w" value="200"></div>
    <div class="field"><label for="ns-f">Food</label><input type="number" id="ns-f" value="120"></div>
    <div class="field"><label for="ns-i">Infant kits</label><input type="number" id="ns-i" value="2"></div>
    <button class="btn primary" id="ns-add">Add stop</button></div><p class="hint" style="margin-top:6px">Tip: click the map to fill latitude and longitude.</p></div>`;
  $('ns-add').onclick = () => { const d = $('ns-d').value, n = $('ns-n').value.trim(); if(!n){ RR.toast('Enter a place name.'); return; }
    const max = Math.max(0,...RR.store.all('stops').filter(s=>s.driverId===d).map(s=>s.order));
    RR.store.put('stops',{driverId:d,name:n,lat:+$('ns-lat').value,lon:+$('ns-lon').value,items:{water:+$('ns-w').value||0,food:+$('ns-f').value||0,infant:+$('ns-i').value||0},order:max+1,status:'pending',note:'',source:'admin',createdAt:Date.now()});
    RR.toast('Stop sent to the driver'); };
}
map.on('click', e => { if(draw){ draw.pts.push([+e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5)]); drawTemp(); return; } if(tab==='fleet' && $('ns-lat')){ $('ns-lat').value = e.latlng.lat.toFixed(4); $('ns-lon').value = e.latlng.lng.toFixed(4); } });

function tabRoads(){
  const r = RR.store.all('reports').sort((a,b)=>b.createdAt-a.createdAt);
  $('panel').innerHTML = `<p class="hint" style="margin-bottom:10px">Reports from drivers. Every driver's route options are checked against these within ${RR.CONFIG.hazardRadiusM} m. Mark a hazard cleared once the road is open again.</p>
  <ul class="rows">${r.map(h=>`<li><div class="rowhead"><span class="pill ${h.type==='safe'?'ok':RR.HAZ[h.type]?.sev>=3?'bad':'warn'}">${RR.HAZ[h.type]?.label}</span><b>${RR.esc(h.note||'')}</b><button class="btn small" style="margin-left:auto" data-clear="${h.id}">${h.type==='safe'?'Remove':'Mark cleared'}</button></div><span class="meta">${RR.esc(h.by)} · ${RR.ago(h.createdAt)} · <span class="mono">${(+h.lat).toFixed(4)}, ${(+h.lon).toFixed(4)}</span></span></li>`).join('')||'<li class="hint">No reports.</li>'}</ul>`;
}

const AGENCIES = ['State EOC (KSDMA)','NDRF','Fire & Rescue','Health / 108 ambulance','Air support (IAF / Navy)','Army engineers (bridge)','District control room'];
const TYPES = ['Boat evacuation','Airlift / air drop','Medical evacuation','Rescue team','Bridge / road clearing','More supplies','Fuel / vehicle breakdown'];
let escDraft = null;
function tabEsc(){
  const list = RR.store.all('escalations').sort((a,b)=>(a.status==='resolved')-(b.status==='resolved')||b.createdAt-a.createdAt);
  const d = escDraft || {};
  $('panel').innerHTML = `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px">
  <div class="stack"><div class="lbl">New request to a higher authority</div>
    <div class="grid2"><div class="field"><label for="e-to">Send to</label><select id="e-to">${AGENCIES.map(a=>`<option ${a===d.to?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label for="e-type">Help needed</label><select id="e-type">${TYPES.map(a=>`<option ${a===d.type?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label for="e-urg">Urgency</label><select id="e-urg">${['Critical','High','Medium'].map(a=>`<option ${a===(d.urgency||'High')?'selected':''}>${a}</option>`).join('')}</select></div></div>
    <div class="grid2"><div class="field"><label for="e-place">Location</label><input type="text" id="e-place" value="${RR.esc(d.place||'')}"></div><div class="field"><label for="e-people">People affected</label><input type="number" id="e-people" value="${d.people||0}"></div></div>
    <div class="field"><label for="e-note">Situation and justification</label><textarea id="e-note" rows="4">${RR.esc(d.note||'')}</textarea></div>
    <div class="btns"><button class="btn danger" id="e-send">Send request</button></div>
    <p class="hint">The request is logged with a timeline. Use “Copy situation report” to send the same text through the official channel (email, NDMA portal or WhatsApp group) until direct integration exists.</p></div>
  <div class="stack"><div class="lbl">Requests and responses</div>${list.map(e=>`<div class="esc ${e.urgency==='Critical'?'crit':''}">
    <div class="rowhead"><b>${RR.esc(e.type)}</b><span class="hint">→ ${RR.esc(e.to)}</span>${escPill(e.status)}<span class="pill ${e.urgency==='Critical'?'bad':e.urgency==='High'?'warn':''}">${e.urgency}</span></div>
    <span class="meta">${RR.esc(e.place)} · ${e.people} people · raised by ${e.from==='driver'?'driver '+RR.esc(e.by):'control room'} · ${RR.ago(e.createdAt)}</span>
    ${e.note?`<div style="font-size:13.5px">${RR.esc(e.note)}</div>`:''}
    <ul class="timeline">${(e.timeline||[]).map(t=>`<li><time>${RR.clock(t.t)}</time><b>${t.s}</b> ${RR.esc(t.n||'')}</li>`).join('')}</ul>
    <div class="btns">${e.status!=='resolved'?`${e.status==='sent'?`<button class="btn small" data-adv="${e.id}" data-to="acknowledged">Mark acknowledged</button>`:''}${e.status!=='dispatched'?`<button class="btn small" data-adv="${e.id}" data-to="dispatched">Help dispatched</button>`:''}<button class="btn small" data-adv="${e.id}" data-to="resolved">Resolved</button><button class="btn small" data-fwd="${e.id}">Forward higher</button>`:''}<button class="btn small" data-sitrep="${e.id}">Copy situation report</button></div>
  </div>`).join('')||'<p class="hint">No requests yet.</p>'}</div></div>`;
  $('e-send').onclick = () => {
    const place = $('e-place').value.trim(); if(!place){ RR.toast('Add the location.'); return; }
    RR.store.put('escalations',{from:'admin',by:S.id,to:$('e-to').value,type:$('e-type').value,place,lat:d.lat||null,lon:d.lon||null,people:+$('e-people').value||0,urgency:$('e-urg').value,note:$('e-note').value,status:'sent',createdAt:Date.now(),timeline:[{t:Date.now(),s:'sent',n:'Sent to '+$('e-to').value+' by '+S.name}]});
    if(d.sosId && RR.store.get('sos',d.sosId)) RR.store.patch('sos', d.sosId, {status:'escalated'});
    escDraft = null; RR.toast('Request sent and logged'); tabEsc();
  };
}
function sitrep(e){
  const o = openSOS();
  return `SITUATION REPORT — ${RR.CONFIG.district}\n${new Date().toLocaleString('en-IN')}\nFrom: ${S.name} (${S.id})\nTo: ${e.to}\n\nREQUEST: ${e.type} — ${e.urgency.toUpperCase()}\nLocation: ${e.place}${e.lat?` (${(+e.lat).toFixed(5)}, ${(+e.lon).toFixed(5)})`:''}\nPeople affected: ${e.people}\n${e.note?'Details: '+e.note+'\n':''}\nDISTRICT PICTURE\nOpen SOS: ${o.length} (${o.filter(s=>RR.sosPriority(s)>=70).length} critical), ${o.reduce((t,s)=>t+(+s.people||0),0)} people waiting\nRoad hazards: ${RR.store.all('reports').filter(r=>r.type!=='safe').map(r=>RR.HAZ[r.type].label+' — '+(r.note||'')).join('; ')||'none'}\n\nReference: ${e.id}`;
}

function tabSMS(){
  $('panel').innerHTML = `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px"><div class="stack">
    <p class="hint">SOS messages sent by SMS arrive at the gateway number <b class="mono">${RR.esc(RR.CONFIG.smsGateway)}</b>. With an SMS gateway (e.g. an Android phone running an SMS-forwarding app, or a bulk-SMS provider's inbound webhook) they are added automatically. For the demo, paste received SMS text here.</p>
    <div class="field"><label for="smsIn">Received SMS text (one or many)</label><textarea id="smsIn" rows="6" placeholder="RR1 11.47720,76.14800 P12 I2 E3 J1 NRMW T2610301830 | Mundakkai school terrace"></textarea></div>
    <div class="btns"><button class="btn primary" id="smsAdd">Add to SOS requests</button><button class="btn" id="smsSample">Insert a sample SMS</button></div></div>
    <div class="stack"><div class="lbl">Code format (fits one SMS)</div><pre class="sitrep">RR1 lat,lon P# I# E# J# N(needs) T(yymmddhhmm UTC) [C phone] | landmark. note
P people · I infants · E elderly · J injured
Needs: R rescue · M medical · W water · F food · B baby/infant · S shelter</pre></div></div>`;
  $('smsSample').onclick = () => { $('smsIn').value = RR.encodeSOS({lat:11.6742,lon:76.1302,people:27,infants:2,elderly:6,injured:0,needs:['water','food','shelter'],createdAt:Date.now()-40*60e3,place:'Muttil, Kuttamangalam school',note:'Roof leaking, 6 elderly'}); };
  $('smsAdd').onclick = () => { const found = $('smsIn').value.split(/(?=RR1\s)/).map(RR.decodeSOS).filter(Boolean);
    if(!found.length){ RR.toast('No ReliefReady code found. Codes start with RR1.'); return; }
    found.forEach(s => RR.store.put('sos', {...s, channel:'sms', status:'new'})); $('smsIn').value=''; RR.toast(found.length+' SOS added from SMS'); };
}

/* impact zones */
let draw = null;
const drawLay = L.layerGroup().addTo(map);
map.on('popupopen', () => { if(draw) map.closePopup(); });
function drawTemp(){
  drawLay.clearLayers(); if(!draw) return;
  if(draw.pts.length>1) L.polyline(draw.pts.concat(draw.pts.length>2?[draw.pts[0]]:[]), {className:'zn zn-'+draw.type, weight:2, dashArray:'5 4'}).addTo(drawLay);
  draw.pts.forEach(p => L.circleMarker(p, {radius:4, className:'zn zn-'+draw.type, fillOpacity:1}).addTo(drawLay));
  const n = draw.bar.querySelector('[data-n]'); if(n) n.textContent = draw.pts.length;
}
function startDraw(){
  const name = $('z-name').value.trim(); if(!name){ RR.toast('Name the zone first.'); $('z-name').focus(); return; }
  if(draw) endDraw();
  const bar = document.createElement('div'); bar.className = 'drawbar';
  bar.innerHTML = `Click the map to add corners (<span data-n>0</span>) <button type="button" data-d="finish">Finish</button><button type="button" data-d="undo">Undo</button><button type="button" data-d="cancel">Cancel</button>`;
  draw = {name, type:$('z-type').value, source:$('z-src').value.trim(), pts:[], bar};
  bar.onclick = e => { const d = e.target.dataset.d; if(!d) return;
    if(d==='undo'){ draw.pts.pop(); drawTemp(); }
    else if(d==='cancel') endDraw();
    else if(d==='finish'){ if(draw.pts.length<3){ RR.toast('Add at least 3 corners.'); return; }
      RR.store.put('zones', {name:draw.name, type:draw.type, coords:draw.pts, official:false, source:draw.source||('Marked by '+S.name+' on '+new Date().toLocaleString('en-IN')), createdAt:Date.now(), by:S.id});
      RR.toast('Zone saved. Routes and SOS priority now account for it.'); endDraw(); } };
  $('map').appendChild(bar); $('map').classList.add('picking'); $('map').scrollIntoView({behavior:'smooth', block:'center'});
}
function endDraw(){ if(draw && draw.bar) draw.bar.remove(); draw = null; drawLay.clearLayers(); $('map').classList.remove('picking'); }
function tabZones(){
  const list = RR.store.all('zones').sort((a,b)=>(RR.ZONES[b.type]?.sev||0)-(RR.ZONES[a.type]?.sev||0) || (b.createdAt||0)-(a.createdAt||0));
  $('panel').innerHTML = `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px">
  <div class="stack"><div class="lbl">Mark a new zone</div>
    <div class="grid2"><div class="field"><label for="z-name">Zone name</label><input type="text" id="z-name" placeholder="e.g. Kunnampatta slope, no entry"></div>
    <div class="field"><label for="z-type">Type</label><select id="z-type">${Object.entries(RR.ZONES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div></div>
    <div class="field"><label for="z-src">Source</label><input type="text" id="z-src" placeholder="e.g. KSDMA order, NRSC flood map, field report"></div>
    <div class="btns"><button class="btn primary" id="z-draw">Draw on map</button></div>
    <p class="hint">Red, landslide and flooded zones mark every road route that crosses them as unsafe, raise the priority of SOS requests inside them, and suggest the boat crew for flooded stops. Boats may cross flooded zones.</p>
    <p class="hint">Government layers: use the layers button on the map for satellite, terrain and NASA daily imagery. Add Bhuvan (ISRO) or other WMS layers in Settings.</p></div>
  <div class="stack"><div class="lbl">Zones and what they affect</div><ul class="rows">${list.map(z=>{ const im = RR.zoneImpact(z), zt = RR.ZONES[z.type]||{};
    return `<li><div class="rowhead"><i class="zl zn-${z.type}"></i><b>${RR.esc(z.name)}</b><span class="pill ${zt.sev>=3?'bad':zt.sev?'warn':z.type==='relief'?'ok':'info'}">${zt.label}</span>${z.official?'<span class="pill info">Official source</span>':''}
      <span class="btns" style="margin-left:auto"><button class="btn small" data-zzoom="${z.id}">Show</button><button class="btn small" data-zdel="${z.id}">Remove</button></span></div>
      ${zt.sev?`<span class="meta"><b>${im.sos}</b> open SOS · <b>${im.people}</b> people${im.infants?' ('+im.infants+' infants)':''} · ${im.stops} pending stops · ${im.hazards} road hazards${im.vehicles.length?' · vehicles inside: '+RR.esc(im.vehicles.join(', ')):''}</span>`:''}
      <span class="meta">${RR.esc(z.source||'')}${z.sourceUrl?` · <a href="${RR.esc(z.sourceUrl)}" target="_blank" rel="noopener">source</a>`:''}</span></li>`; }).join('')||'<li class="hint">No zones yet.</li>'}</ul></div></div>`;
  $('z-draw').onclick = startDraw;
}
function tabSettings(){
  $('panel').innerHTML = `<div class="stack" style="max-width:560px">
    <div class="field"><label for="cfg-sms">SMS gateway number shown in the SOS app</label><input type="tel" id="cfg-sms" value="${RR.esc(RR.CONFIG.smsGateway)}"></div>
    <div class="btns"><button class="btn primary" id="cfg-save">Save</button></div>
    <div class="lbl" style="margin-top:8px">Server</div>
    <div class="field"><label for="cfg-api">ReliefReady API address</label><input type="text" id="cfg-api" placeholder="https://reliefready-api.onrender.com" value="${RR.esc(RR.CONFIG.api)}"></div>
    <div class="btns"><button class="btn" id="cfg-api-save">Connect</button>${RR.CONFIG.api?'<button class="btn" id="cfg-api-off">Use demo mode</button>':''}${RR.CONFIG.api?`<a class="btn" href="${RR.esc(RR.CONFIG.api)}/docs" target="_blank" rel="noopener">API documentation</a>`:''}</div>
    <p class="hint">${RR.CONFIG.api?'Connected mode: all data is stored in the server database and shared by every signed-in user.':'Demo mode: data is stored in this browser only. Enter the API address to use the shared database.'}</p>
    ${RR.store.mode==='local'?'<div class="btns"><button class="btn" id="cfg-reset">Reset demo data</button></div>':''}
    <div class="lbl" style="margin-top:12px">Government map layers (WMS)</div>
    <p class="hint">Add any public WMS service, for example a Bhuvan (ISRO) flood hazard or flood inundation layer. Copy the service URL and layer name from the Bhuvan Thematic Services portal. Added layers appear in the map's layers button on the control room and driver maps.</p>
    <ul class="rows">${(RR.CONFIG.wms||[]).map((w,i)=>`<li><div class="rowhead"><b>${RR.esc(w.name)}</b><span class="hint mono">${RR.esc(w.layers)}</span><button class="btn small" style="margin-left:auto" data-wdel="${i}">Remove</button></div><span class="meta mono" style="word-break:break-all">${RR.esc(w.url)}</span></li>`).join('')||'<li class="hint">None added.</li>'}</ul>
    <div class="grid2"><div class="field"><label for="w-name">Layer name</label><input type="text" id="w-name" placeholder="Bhuvan flood hazard"></div><div class="field"><label for="w-layers">WMS layer id</label><input type="text" id="w-layers" placeholder="e.g. flood:..."></div></div>
    <div class="field"><label for="w-url">WMS service URL</label><input type="text" id="w-url" placeholder="https://bhuvan-vec2.nrsc.gov.in/bhuvan/wms"></div>
    <div class="field"><label for="w-attr">Credit</label><input type="text" id="w-attr" value="© NRSC/ISRO Bhuvan"></div>
    <div class="btns"><button class="btn" id="w-add">Add layer</button></div>
    <div class="field" style="margin-top:8px"><label for="g-date">NASA daily satellite image date</label><input type="text" id="g-date" placeholder="YYYY-MM-DD (empty = yesterday)" value="${RR.esc(RR.CONFIG.gibsDate||'')}"></div>
    <div class="btns"><button class="btn" id="g-save">Set date</button></div></div>`;
  $('w-add').onclick = () => { const w = {name:$('w-name').value.trim(), url:$('w-url').value.trim(), layers:$('w-layers').value.trim(), attribution:$('w-attr').value.trim()};
    if(!w.name||!/^https:\/\//.test(w.url)||!w.layers){ RR.toast('Enter a name, an https:// WMS URL and the layer id.'); return; }
    RR.saveConfig({wms:[...(RR.CONFIG.wms||[]), w]}); RR.toast('Layer added. Reloading the map.'); setTimeout(()=>location.reload(), 700); };
  $('g-save').onclick = () => { const d = $('g-date').value.trim(); if(d && !/^\d{4}-\d{2}-\d{2}$/.test(d)){ RR.toast('Use the format YYYY-MM-DD.'); return; } RR.saveConfig({gibsDate:d}); RR.toast('Date saved. Reloading the map.'); setTimeout(()=>location.reload(), 700); };
  $('cfg-api-save').onclick = async () => { const u = $('cfg-api').value.trim().replace(/\/+$/,'');
    if(u && !/^https?:\/\//.test(u)){ RR.toast('Enter a full address starting with https://'); return; }
    if(u){ try{ const r = await fetch(u+'/api/health'); if(!r.ok) throw 0; }catch(e){ RR.toast('No ReliefReady server answered at that address.'); return; } }
    RR.setApi(u); try{ localStorage.removeItem('rr.session'); }catch(e){} location.reload(); };
  const off = $('cfg-api-off'); if(off) off.onclick = () => { RR.setApi(''); try{ localStorage.removeItem('rr.session'); }catch(e){} location.reload(); };
  $('cfg-save').onclick = () => { RR.saveConfig({smsGateway:$('cfg-sms').value.trim()||RR.CONFIG.smsGateway}); RR.toast('Saved for this browser'); };
  const r = $('cfg-reset'); if(r) r.onclick = () => { RR.store.reset(); RR.toast('Demo data restored'); };
}
window.escPill = s => ({sent:'<span class="pill warn">Awaiting response</span>',acknowledged:'<span class="pill info">Acknowledged</span>',dispatched:'<span class="pill info">Help dispatched</span>',resolved:'<span class="pill ok">Resolved</span>'}[s]||'');

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; const D = b.dataset;
  if(D.verify) RR.store.patch('sos', D.verify, {status:'verified'});
  else if(D.served) RR.store.patch('sos', D.served, {status:'served'});
  else if(D.assign){ const s = RR.store.get('sos', D.assign), drv = $('as-'+s.id).value; if(!s.lat){ RR.toast('This request has no GPS position. Add a stop manually in Drivers and stops.'); return; }
    const max = Math.max(0,...RR.store.all('stops').filter(x=>x.driverId===drv).map(x=>x.order));
    RR.store.put('stops',{driverId:drv,name:s.place||'SOS location',lat:s.lat,lon:s.lon,items:{water:(s.people||0)*3,food:s.people||0,infant:s.infants||0},order:max+1,status:'pending',note:`SOS: ${needTxt(s)}. ${s.note||''}`.trim(),source:'sos',sosId:s.id,createdAt:Date.now()});
    RR.store.patch('sos', s.id, {status:'assigned', assignedTo:drv}); RR.toast('Assigned. It is now in the driver\'s stop list.'); }
  else if(D.escsos){ const s = RR.store.get('sos', D.escsos); escDraft = {to:(s.needs||[]).includes('rescue')?'NDRF':(s.needs||[]).includes('medical')?'Health / 108 ambulance':'State EOC (KSDMA)', type:(s.needs||[]).includes('rescue')?'Rescue team':(s.needs||[]).includes('medical')?'Medical evacuation':'More supplies', urgency:RR.sosPriority(s)>=70?'Critical':'High', place:s.place||'GPS location', people:s.people, note:`${s.people} people (${s.infants||0} infants, ${s.elderly||0} elderly, ${s.injured||0} injured). Needs: ${needTxt(s)}. ${s.note||''}`, lat:s.lat, lon:s.lon, sosId:s.id};
    tab='esc'; renderTab(); $('e-note').focus(); }
  else if(D.delstop) RR.store.del('stops', D.delstop);
  else if(D.zzoom){ const z = RR.store.get('zones', D.zzoom); if(z){ map.fitBounds(L.polygon(z.coords).getBounds(), {padding:[30,30]}); $('map').scrollIntoView({behavior:'smooth', block:'center'}); } }
  else if(D.zdel) RR.store.del('zones', D.zdel);
  else if(D.wdel!=null){ const w = [...(RR.CONFIG.wms||[])]; w.splice(+D.wdel,1); RR.saveConfig({wms:w}); location.reload(); }
  else if(D.clear) RR.store.del('reports', D.clear);
  else if(D.adv){ const e = RR.store.get('escalations', D.adv); const lbl = {acknowledged:'Acknowledged by '+e.to, dispatched:'Help dispatched by '+e.to, resolved:'Closed by control room'}[D.to];
    RR.store.put('escalations', {...e, status:D.to, timeline:[...(e.timeline||[]), {t:Date.now(), s:D.to, n:lbl}]}); }
  else if(D.fwd){ const e = RR.store.get('escalations', D.fwd); const order = ['District control room','State EOC (KSDMA)','NDRF','Air support (IAF / Navy)']; const i = order.indexOf(e.to); const nx = i<0 ? 'State EOC (KSDMA)' : order[Math.min(order.length-1, i+1)];
    RR.store.put('escalations', {...e, to:nx, status:'sent', timeline:[...(e.timeline||[]), {t:Date.now(), s:'forwarded', n:'Forwarded to '+nx+' — no adequate response from '+e.to}]}); }
  else if(D.sitrep){ RR.copy(sitrep(RR.store.get('escalations', D.sitrep)), b); }
});

function render(){ renderKpis(); drawMap(); renderFeed(); renderTab(); }
RR.store.on(render); render();
}
})();
</script>
