<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg">
<title>ReliefReady Control Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="assets/common.css">
<link rel="stylesheet" href="assets/maptools.css">
<style>
/* Control room: one top bar with tabs (no sidebar); map-first overview; flat panels separated by rules. */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:900}
.hdr .bar{position:static}
.hdr .who{color:var(--navy-ink)}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--navy-muted);white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.warn::before{background:var(--warn)} .conn.bad::before{background:var(--bad)}
.tabs2{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs2 .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:0}
.tabs2 button,.tabs2 a{flex:none;display:flex;align-items:center;gap:6px;border:0;background:none;padding:12px 14px 10px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
.tabs2 button:hover,.tabs2 a:hover{color:var(--ink)}
.tabs2 button[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs2 .sep{flex:1}
.tabs2 svg{display:none}
.main{padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.mh h1{font-size:24px;font-weight:700}
.mh .right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mh p{margin:3px 0 0;color:var(--muted);font-size:14px}
.mh .when{font:500 13px var(--f-mono);color:var(--muted)}
/* status strip: one row of figures with rules between them */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0;margin:0 0 -1px 0}
.kpi .ico{display:none}
.kpi b{font:600 24px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;font-weight:600}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.alert b{color:var(--bad)}
.ov3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.ov3{grid-template-columns:minmax(0,1fr)}}
.fleet{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fleet li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:3px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.fleet li:last-child{border-bottom:0}
.fleet .veh{position:static;width:32px;height:32px;box-shadow:none;grid-row:span 2}
.fleet .veh svg{width:18px;height:18px}
.fleet .bar2{grid-column:2/-1;height:5px;border-radius:2px;background:var(--sunk);overflow:hidden;display:flex}
.fleet .bar2 span{display:block;height:100%}
.hbar{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{height:9px;border-radius:2px;background:var(--sunk);overflow:hidden}
.hbar .t span{display:block;height:100%;background:var(--accent)}
.hbar .t span.r{background:var(--bad)} .hbar .t span.w{background:var(--warn)}
.hbar b{font:600 13px var(--f-mono);text-align:right;white-space:nowrap;min-width:64px}
.pbar{grid-column:2;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:2px}
.pbar span{display:block;height:100%}
.top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.top.solo{grid-template-columns:minmax(0,1fr)}
.top .mapbox{height:min(64vh,620px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.feed{max-height:calc(min(64vh,620px) - 50px);overflow:auto}
.prio{font:700 16px/1 var(--f-mono);min-width:36px;text-align:center;padding:6px 0;border-radius:3px;background:var(--sunk)}
.prio.hi{background:var(--bad-bg);color:var(--bad)} .prio.mid{background:var(--warn-bg);color:var(--warn)}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.tabpanel{padding:18px}
.drv{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.drvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline .field{min-width:120px;flex:1}
.esc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.esc.crit{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.sitrep{white-space:pre-wrap;font:12.5px/1.55 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0;max-height:260px;overflow:auto}
.rt-line{stroke:var(--accent)}
@media (max-width:1100px){.top{grid-template-columns:minmax(0,1fr)}.feed{max-height:420px}.top .mapbox{height:420px}}
@media (max-width:700px){.hdr .who b,.hdr .conn{display:none}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div id="root"></div>
<script src="assets/leaflet.js"></script>
<script src="js/model.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/maptools.js"></script>
<script>
(function(){
const root = document.getElementById('root');
let S = RR.session();
if(!S || S.role!=='admin' || (RR.CONFIG.api && !S.token)){ RR.renderSignIn(root, 'admin', s => { S = s; boot(); }); } else boot();

function boot(){
const $ = id => document.getElementById(id);
root.innerHTML = `
<div class="hdr">
<header class="bar"><div class="wrap">
  ${RR.backBtn()}
  <a class="logo" href="index.html">${RR.logo}<b>ReliefReady</b><span>Control room · ${RR.esc(RR.CONFIG.district)}</span></a>
  <span class="grow"></span>
  <span class="conn" id="mode">Connecting…</span>
  <div class="who"><b>${RR.esc(S.name)}</b><button class="btn small" id="out">Sign out</button></div>
</div></header>
<nav class="tabs2" aria-label="Control room sections"><div class="wrap" id="tabs">
  <button type="button" data-tab="overview">Overview</button>
  <button type="button" data-tab="sos">SOS requests<span class="count" id="c-sos"></span></button>
  <button type="button" data-tab="fleet">Fleet and stops</button>
  <button type="button" data-tab="zones">Impact zones</button>
  <button type="button" data-tab="roads">Road conditions<span class="count" id="c-roads"></span></button>
  <button type="button" data-tab="esc">Agency requests<span class="count" id="c-esc"></span></button>
  <button type="button" data-tab="sms">SMS inbox</button>
  <button type="button" data-tab="settings">Settings</button>
  <span class="sep"></span>
  <a href="planner.html">Allocation planner →</a>
</div></nav>
</div>
<main class="main wrap">
  <header class="mh"><div><h1 id="pt">Overview</h1><p id="ps"></p></div><div class="right"><span class="livechip" id="live"><i></i>Live</span><span class="when" id="when"></span></div></header>
  <div class="kpis" id="kpis"></div>
  <div class="top" id="mapRow">
    <div><div class="mapbox" id="map"></div><div class="vlegend" style="margin-top:8px"><span>${RR.vehSvg('truck')}Truck</span><span>${RR.vehSvg('jeep')}4x4 jeep</span><span class="b">${RR.vehSvg('boat')}Rescue boat</span><span><span class="pin sos" style="display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px"></span>SOS</span><span><span class="pin stop" style="display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px"></span>Planned stop</span><span><i class="zl" style="border-color:var(--ink);border-style:solid;background:transparent"></i>District boundary</span></div><div class="vlegend" style="margin-top:4px">${RR.zoneLegend()}</div></div>
    <section class="panel" id="feedPanel"><div class="ph"><h2>Priority queue</h2><span class="sub">Open SOS, highest first</span></div><div class="pb feed" id="feed"></div></section>
  </div>
  <div class="ov3" id="ovExtra">
    <section class="panel"><div class="ph"><h2>Fleet status</h2><span class="sub">Stops delivered per vehicle</span></div><div class="pb" id="ovFleet"></div></section>
    <section class="panel"><div class="ph"><h2>Open requests by need</h2><span class="sub">Requests (people)</span></div><div class="pb" id="ovNeeds"></div></section>
    <section class="panel"><div class="ph"><h2>Agency requests</h2><span class="sub">Latest first</span></div><div class="pb" id="ovEsc"></div></section>
  </div>
  <section class="panel" id="panelWrap"><div class="tabpanel" id="panel"></div></section>
</main>`;
$('out').onclick = RR.signOut;
const tick = () => { $('when').textContent = RR.CONFIG.district + ' · ' + new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
tick(); setInterval(tick, 30000);
const SECTIONS = {
  overview:['Operations overview','Live picture of requests, vehicles, impact zones and road conditions across the district.', true, true, true],
  sos:['SOS requests','Every request from the SOS app, SMS line and driver relays, ranked by priority.', false, false, false],
  fleet:['Fleet and stops','Vehicles, their delivery stops and progress. Click the map to place a new stop.', true, false, false],
  zones:['Impact zones','Areas that block routes, raise SOS priority and decide boat or road delivery.', true, false, false],
  roads:['Road conditions','Hazards reported by drivers. Every route option is checked against these.', true, false, false],
  esc:['Agency requests','Requests for help to the State EOC, NDRF, health services and air support.', false, false, false],
  sms:['SMS inbox','SOS messages received by SMS from areas without internet.', false, false, false],
  settings:['Settings','Server connection, SMS number and government map layers.', false, false, false],
};
let tab = 'overview'; try{ tab = sessionStorage.getItem('rr.tab') || 'overview'; }catch(e){}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if(!b) return; tab = b.dataset.tab; try{ sessionStorage.setItem('rr.tab', tab); }catch(e){} renderTab(); };

const drivers = () => { const d = RR.store.all('drivers'); RR.ACCOUNTS.filter(a=>a.role==='driver').forEach(a => { if(!d.find(x=>x.id===a.id)) d.push({id:a.id,name:a.name,vehicle:a.vehicle,type:a.type,lat:RR.DEPOT.lat,lon:RR.DEPOT.lon,status:'not signed in',lastSeen:0}); }); return d; };
const openSOS = () => RR.store.all('sos').filter(s=>s.status!=='served').sort((a,b)=>RR.sosPriority(b)-RR.sosPriority(a));
const needTxt = s => (s.needs||[]).map(k=>RR.NEEDS.find(n=>n.k===k)?.en||k).join(', ');
const chan = {app:'App',sms:'SMS',relay:'Relayed by driver'};
const pcls = p => p>=70?'hi':p>=45?'mid':'';
const ST = {new:['New','warn'],verified:['Verified','info'],assigned:['Assigned','info'],served:['Served','ok'],escalated:['Escalated','bad']};

/* map */
const map = RR.makeMap($('map'), {fitDistrict:true, locate:true, saveZone:true, aoiActions:[{label:'Request help for this area', run:(a, st) => {
  const flood = st.graded.find(g => g.t==='flooded');
  escDraft = {to: flood && flood.pct>30 ? 'NDRF' : 'State EOC (KSDMA)', type: st.critical ? 'Rescue team' : 'More supplies', urgency: st.critical ? 'Critical' : 'High',
    place:a.name, lat:+st.centre.lat.toFixed(5), lon:+st.centre.lon.toFixed(5), people:st.people,
    note:`Area of interest ${a.name}: ${st.area.toFixed(1)} km². ${st.sos.length} open SOS, ${st.people} people waiting (${st.infants} infants, ${st.elderly} elderly, ${st.injured} injured). `
      + (st.graded.length ? st.graded.map(g => g.label+' '+g.pct.toFixed(0)+'%').join(', ')+'. ' : '') + (st.hazards.length ? st.hazards.length+' road hazards reported. ' : '')
      + `Daily need (Sphere): ${st.needs.water} L water, ${st.needs.food} food rations.`};
  tab = 'esc'; renderTab(); const n = $('e-note'); if(n){ n.scrollIntoView({behavior:'smooth', block:'center'}); n.focus(); } }}]});
const lay = L.layerGroup().addTo(map);
RR.addMapLayer(map, 'SOS requests, vehicles and road reports', lay, '<i class="rr-dot" style="background:var(--sos)"></i>');
function drawMap(){
  RR.drawZones(map);
  lay.clearLayers();
  L.marker([RR.DEPOT.lat,RR.DEPOT.lon],{icon:RR.icon('pin depot')}).bindPopup(`<b>${RR.DEPOT.name}</b>`).addTo(lay);
  RR.store.all('reports').forEach(h => L.marker([h.lat,h.lon],{icon:RR.hzIcon(h)}).bindPopup(`<b>${RR.HAZ[h.type]?.label}</b><br>${RR.esc(h.note)}<br><span class="hint">${RR.esc(h.by)} · ${RR.ago(h.createdAt)}</span>`).addTo(lay));
  RR.store.all('stops').filter(s=>s.status!=='delivered').forEach(s => L.marker([s.lat,s.lon],{icon:RR.icon('pin stop')}).bindPopup(`<b>${RR.esc(s.name)}</b><br>Driver ${RR.esc(s.driverId)} · ${s.status}`).addTo(lay));
  openSOS().filter(s=>s.lat).forEach(s => L.marker([s.lat,s.lon],{icon:RR.icon('pin sos'+(RR.sosPriority(s)>=70?' pulse':''))}).bindPopup(`<b>SOS · ${RR.esc(s.place||'')}</b><br>Priority ${RR.sosPriority(s)} · ${s.people} people<br>${needTxt(s)}<br>${RR.esc(s.note||'')}`).addTo(lay));
  drivers().forEach(d => { if(!d.lastSeen) return; L.marker([d.lat,d.lon],{icon:RR.vehIcon(d.type, d.name.split(' ')[0]), zIndexOffset:500}).bindPopup(`<b>${RR.esc(d.name)}</b><br>${RR.esc(d.vehicle)}<br>${RR.esc(d.status)} · ${RR.ago(d.lastSeen)}`).addTo(lay);
    const next = RR.store.all('stops').filter(s=>s.driverId===d.id && (s.status==='pending'||s.status==='enroute')).sort((a,b)=>a.order-b.order)[0];
    if(next) L.polyline([[d.lat,d.lon],[next.lat,next.lon]],{weight:2, dashArray:'4 6', className:'rt-line'}).addTo(lay); });
}

const KI = {
  sos:'<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.4 5 2.8 5 5.8"/></svg>',
  fleet:'<svg viewBox="0 0 24 24"><path d="M2 7h12v9H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  roads:'<svg viewBox="0 0 24 24"><path d="M8 3L4 21M16 3l4 18M12 5v2M12 11v2M12 17v2"/></svg>',
  esc:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
};
function renderKpis(){
  const o = openSOS(), crit = o.filter(s=>RR.sosPriority(s)>=70).length, ppl = o.reduce((t,s)=>t+(+s.people||0),0);
  const active = drivers().filter(d=>d.lastSeen && Date.now()-d.lastSeen<3600e3).length;
  const escOpen = RR.store.all('escalations').filter(e=>e.status!=='resolved').length;
  const unsafe = RR.store.all('reports').filter(r=>r.type!=='safe').length;
  const inZone = o.filter(s=>RR.impactZoneAt(s)).reduce((t,s)=>t+(+s.people||0),0);
  const stops = RR.store.all('stops'), pend = stops.filter(x=>x.status==='pending'||x.status==='enroute'), done = stops.filter(x=>x.status==='delivered');
  const water = pend.reduce((t,x)=>t+(+x.items?.water||0),0), food = pend.reduce((t,x)=>t+(+x.items?.food||0),0);
  const awaiting = RR.store.all('escalations').filter(e=>e.status==='sent').length, zonesN = RR.store.all('zones').filter(z=>(RR.ZONES[z.type]?.sev||0)>=3).length;
  const K = [
    ['sos', o.length, 'Open SOS requests', `${o.filter(s=>s.status==='new').length} new · ${crit} critical`, crit>0?'alert':''],
    ['people', ppl.toLocaleString('en-IN'), 'People waiting for aid', `${inZone.toLocaleString('en-IN')} inside impact zones`, inZone>0?'alert':''],
    ['fleet', active+' / '+drivers().length, 'Vehicles active', `${pend.length} stops pending · ${done.length} delivered`, 'good'],
    ['box', water.toLocaleString('en-IN')+' L', 'Water on the way', `${food.toLocaleString('en-IN')} food packets planned`, ''],
    ['roads', unsafe, 'Road hazards', `${zonesN} danger zones marked`, unsafe>0?'alert':''],
    ['esc', escOpen, 'Agency requests open', `${awaiting} awaiting response`, awaiting>0?'alert':''],
  ];
  $('kpis').innerHTML = K.map(([i,b,l,sub,c])=>`<div class="kpi ${c}"><span class="ico">${KI[i]}</span><b>${b}</b><span class="l">${l}</span><span class="s">${sub}</span></div>`).join('');
  const live = $('live');
  if(RR.CONFIG.api && RR.store.apiOk===false){ live.className='livechip off'; live.innerHTML='<i></i>Reconnecting'; }
  else { live.className='livechip'; live.innerHTML = '<i></i>'+(RR.CONFIG.api ? 'Live · synced '+(RR.store.lastSync?RR.ago(RR.store.lastSync):'now') : 'Live · demo data'); }
  $('c-sos').textContent = o.filter(s=>s.status==='new').length || ''; $('c-roads').textContent = unsafe||''; $('c-esc').textContent = RR.store.all('escalations').filter(e=>e.status==='sent').length || '';
  const m = $('mode');
  if(RR.CONFIG.api){ const ok = RR.store.apiOk; m.textContent = ok===false ? 'Server unreachable, showing last data' : 'Connected to server'; m.className = 'conn'+(ok===false?' bad':''); }
  else { m.textContent = RR.store.mode==='shared' ? 'Shared demo data' : 'Demo mode, this browser'; m.className = 'conn warn'; }
}
function renderFeed(){
  const o = openSOS();
  $('feed').innerHTML = o.length ? '<ul class="rows">'+o.slice(0,12).map(s=>{ const p = RR.sosPriority(s); return `<li><span class="prio ${pcls(p)}">${p}</span><div><div class="pbar" style="margin:0 0 6px"><span style="width:${p}%;background:${p>=70?'var(--bad)':p>=45?'var(--warn)':'var(--accent)'}"></span></div><div class="rowhead"><b>${RR.esc(s.place||'GPS location')}</b><span class="pill ${ST[s.status]?.[1]}">${ST[s.status]?.[0]}</span>${RR.zonePill(s)}</div><span class="meta">${s.people} people${s.infants?' · '+s.infants+' infants':''}${s.injured?' · '+s.injured+' injured':''} · ${needTxt(s)} · ${chan[s.channel]||s.channel} · ${RR.ago(s.createdAt)}</span></div></li>`; }).join('')+'</ul>' : '<p class="hint">No open requests.</p>';
}

/* tabs */
function renderTab(){
  if(!SECTIONS[tab]) tab = 'overview';
  const [t, sub, showMap, showFeed, showKpi] = SECTIONS[tab];
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.dataset.tab===tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  try{ window.scrollTo({top:0}); }catch(e){}
  $('pt').textContent = t; $('ps').textContent = sub;
  const wasHidden = $('mapRow').hidden;
  $('mapRow').hidden = !showMap; $('feedPanel').hidden = !showFeed; $('mapRow').classList.toggle('solo', !showFeed); $('kpis').hidden = !showKpi; $('ovExtra').hidden = tab!=='overview'; $('panelWrap').hidden = tab==='overview';
  if(showMap) setTimeout(() => map.invalidateSize(), 30);
  if(tab==='overview'){ renderOverview(); return; }
  if(document.activeElement && $('panel').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  ({sos:tabSOS, fleet:tabFleet, roads:tabRoads, zones:tabZones, esc:tabEsc, sms:tabSMS, settings:tabSettings})[tab]();
}
const drvOpts = sel => drivers().map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${RR.esc(d.name)} · ${RR.esc(d.vehicle)}</option>`).join('');

function tabSOS(){
  const all = RR.store.all('sos').sort((a,b)=>(a.status==='served')-(b.status==='served') || RR.sosPriority(b)-RR.sosPriority(a));
  $('panel').innerHTML = `<p class="hint" style="margin-bottom:10px">Priority (0–100) weighs need type (rescue and medical first), people, share of infants, elderly and injured, and waiting time. Assigning creates a stop in that driver's app with the quantities predicted by the demand model for one day.</p>
  <p class="hint" style="margin-bottom:10px">${RR.modelCard()}</p>
  <div class="tw"><table><thead><tr><th>Priority</th><th>Location</th><th>Need</th><th>Model estimate / day</th><th>Source</th><th>Status</th><th>Action</th></tr></thead><tbody>${all.map(s=>{const p=RR.sosPriority(s); return `<tr>
    <td><span class="prio ${pcls(p)}">${p}</span></td>
    <td><b>${RR.esc(s.place||'GPS location')}</b><div class="meta mono">${s.lat?(+s.lat).toFixed(4)+', '+(+s.lon).toFixed(4):'no GPS'}</div>${s.note?`<div class="meta">${RR.esc(s.note)}</div>`:''}</td>
    <td>${s.people} people · ${s.infants||0} inf · ${s.elderly||0} eld · ${s.injured||0} inj<div class="meta">${needTxt(s)}</div></td>

  else if(D.served) RR.store.patch('sos', D.served, {status:'served'});
  else if(D.assign){ const s = RR.store.get('sos', D.assign), drv = $('as-'+s.id).value; if(!s.lat){ RR.toast('This request has no GPS position. Add a stop manually in Drivers and stops.'); return; }
    const max = Math.max(0,...RR.store.all('stops').filter(x=>x.driverId===drv).map(x=>x.order));
    RR.store.put('stops',{driverId:drv,name:s.place||'SOS location',lat:s.lat,lon:s.lon,items:(d => d ? {water:d.water, food:d.food, infant:s.infants||0, meds:d.meds} : {water:(s.people||0)*3, food:s.people||0, infant:s.infants||0})(RR.demandForSOS(s)),order:max+1,status:'pending',note:`SOS: ${needTxt(s)}. ${s.note||''}`.trim(),source:'sos',sosId:s.id,createdAt:Date.now()});
    RR.store.patch('sos', s.id, {status:'assigned', assignedTo:drv}); RR.toast('Assigned. It is now in the driver\'s stop list.'); }
  else if(D.escsos){ const s = RR.store.get('sos', D.escsos); escDraft = {to:(s.needs||[]).includes('rescue')?'NDRF':(s.needs||[]).includes('medical')?'Health / 108 ambulance':'State EOC (KSDMA)', type:(s.needs||[]).includes('rescue')?'Rescue team':(s.needs||[]).includes('medical')?'Medical evacuation':'More supplies', urgency:RR.sosPriority(s)>=70?'Critical':'High', place:s.place||'GPS location', people:s.people, note:`${s.people} people (${s.infants||0} infants, ${s.elderly||0} elderly, ${s.injured||0} injured). Needs: ${needTxt(s)}. ${s.note||''}`, lat:s.lat, lon:s.lon, sosId:s.id};
    tab='esc'; renderTab(); $('e-note').focus(); }
  else if(D.goto){ tab = D.goto; renderTab(); }
  else if(D.delstop) RR.store.del('stops', D.delstop);
  else if(D.zzoom){ const z = RR.store.get('zones', D.zzoom); if(z){ map.fitBounds(L.polygon(z.coords).getBounds(), {padding:[30,30]}); $('map').scrollIntoView({behavior:'smooth', block:'center'}); } }
  else if(D.zdel) RR.store.del('zones', D.zdel);
  else if(D.wdel!=null){ const w = [...(RR.CONFIG.wms||[])]; w.splice(+D.wdel,1); RR.saveConfig({wms:w}); location.reload(); }
  else if(D.clear) RR.store.del('reports', D.clear);
  else if(D.adv){ const e = RR.store.get('escalations', D.adv); const lbl = {acknowledged:'Acknowledged by '+e.to, dispatched:'Help dispatched by '+e.to, resolved:'Closed by control room'}[D.to];
    RR.store.put('escalations', {...e, status:D.to, timeline:[...(e.timeline||[]), {t:Date.now(), s:D.to, n:lbl}]}); }
  else if(D.fwd){ const e = RR.store.get('escalations', D.fwd); const order = ['District control room','State EOC (KSDMA)','NDRF','Air support (IAF)']; const i = order.indexOf(e.to); const nx = i<0 ? 'State EOC (KSDMA)' : order[Math.min(order.length-1, i+1)];
    RR.store.put('escalations', {...e, to:nx, status:'sent', timeline:[...(e.timeline||[]), {t:Date.now(), s:'forwarded', n:'Forwarded to '+nx+' — no adequate response from '+e.to}]}); }
  else if(D.sitrep){ RR.copy(sitrep(RR.store.get('escalations', D.sitrep)), b); }
});

function renderOverview(){
  if(tab!=='overview') return;
  const stops = RR.store.all('stops');
  $('ovFleet').innerHTML = '<ul class="fleet">'+drivers().map(d=>{ const st = stops.filter(x=>x.driverId===d.id), dn = st.filter(x=>x.status==='delivered').length, bad = st.filter(x=>x.status==='unreachable').length;
    const nx = st.filter(x=>x.status==='pending'||x.status==='enroute').sort((a,b)=>a.order-b.order)[0];
    const pct = st.length ? dn/st.length*100 : 0, bp = st.length ? bad/st.length*100 : 0, on = d.lastSeen && Date.now()-d.lastSeen<3600e3;
    return `<li><span class="veh ${d.type||'truck'}">${RR.vehSvg(d.type)}</span><span><b>${RR.esc(d.name)}</b> <span class="hint">· ${RR.esc(d.vehicle)}</span></span><span class="pill ${on?'ok':''}">${on?RR.esc(d.status||'active'):'offline'}</span>
      <span class="meta" style="grid-column:2/-1">${dn}/${st.length} delivered${nx?' · next: '+RR.esc(nx.name):''}</span>
      <span class="bar2"><span style="width:${pct}%;background:var(--ok)"></span><span style="width:${bp}%;background:var(--bad)"></span></span></li>`; }).join('')+'</ul>';
  const o = openSOS(), maxN = Math.max(1,...RR.NEEDS.map(n=>o.filter(s=>(s.needs||[]).includes(n.k)).length));
  $('ovNeeds').innerHTML = RR.NEEDS.map(n=>{ const list = o.filter(s=>(s.needs||[]).includes(n.k)), c = list.length, ppl = list.reduce((t,s)=>t+(+s.people||0),0);
    return `<div class="hbar"><span>${n.en.split(' /')[0]}</span><span class="t"><span class="${n.k==='rescue'||n.k==='medical'?'r':n.k==='water'?'w':''}" style="width:${c/maxN*100}%"></span></span><b>${c} <span class="hint">(${ppl})</span></b></div>`; }).join('')
    + `<p class="hint" style="margin-top:10px">${o.length} open requests · ${o.reduce((t,s)=>t+(+s.people||0),0)} people · rescue and medical shown in red</p>`;
  const es = RR.store.all('escalations').sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);
  $('ovEsc').innerHTML = es.length ? '<ul class="rows">'+es.map(e=>{ const last = (e.timeline||[]).slice(-1)[0];
    return `<li><div class="rowhead"><b>${RR.esc(e.type)}</b>${escPill(e.status)}</div><span class="meta">${RR.esc(e.to)} · ${RR.esc(e.place)} · ${RR.ago(e.createdAt)}</span>${last?`<span class="meta">${RR.esc(last.n||'')}</span>`:''}</li>`; }).join('')+'</ul><button class="btn small" type="button" data-goto="esc" style="margin-top:8px">Open agency requests</button>' : '<p class="hint">No requests to agencies yet.</p>';
}
function render(){ renderKpis(); drawMap(); renderFeed(); renderTab(); renderOverview(); }
RR.store.on(render); render();
}
})();
</script>
